<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <header>
        <h1>
            pH Scale
        </h1>
    </header>
    <main>
        <section class="alkaline">
            <p class="p14">14.0 very alkaline</p>
            <p class="p13">13.0</p>
            <p class="p12">12.0</p>
            <p class="p11">11.0</p>
            <p class="p10">10.0</p>
            <p class="p9">9.0</p>
            <p class="p8">8.0</p>
        </section>
        <section class="neutral">
            <p class="p7">7.0 neutral</p>
        </section>
        <section class="acid">
            <p class="p6">6.0</p>
            <p class="p5">5.0</p>
            <p class="p4">4.0</p>
            <p class="p3">3.0</p>
            <p class="p2">2.0</p>
            <p class="p1">1.0</p>
            <p class="p0">0.0 very acid</p>
        </section>
    </main>
</body>
</html>
